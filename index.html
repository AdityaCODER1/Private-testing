<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Test | Hello World</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1115;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #181b22;
            border: 1px solid #2a2f3d;
            border-radius: 14px;
            max-width: 600px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .badge {
            display: inline-block;
            background: #ff4c00;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        .output {
            background: #101318;
            border: 1px solid #262b38;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin: 18px 0;
        }
        .meta {
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Model: gemma-4-31b-it</span>
        <h1>Hello World</h1>
        <div class="output">Hello World! I am Gemma 4 31B running via the API.</div>
        <div class>Hello</div>
        <div class="meta">Last built: 14 Nov 2026, 02:28 PM UTC</div>
    </main>
</body>
</html>
